<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#087da4"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Coleman Learning"/>
  <link rel="manifest" href="/colemankidsgames.github.io/manifest.webmanifest"/>
  <title>Coleman Family Learning Program</title>
  <style>
    html,body,#root{min-height:100%;margin:0}
    .boot-card{font-family:system-ui,sans-serif;max-width:680px;margin:12vh auto;padding:28px;border-radius:24px;background:#fff;color:#173650;box-shadow:0 18px 45px #00384f35;text-align:center}
    body{background:linear-gradient(160deg,#7ed6ef,#087da4)}
  </style>
</head>
<body>
  <div id="root"><div class="boot-card" id="boot-status"><h1>Coleman Family Learning Program</h1><p>Loading the learning adventure…</p></div></div>
  <script>
    window.addEventListener('error', function (event) {
      var box=document.getElementById('boot-status');
      if(box){box.innerHTML='<h1>Site loaded, but the app did not start.</h1><p>Please refresh once. If this message remains, take a screenshot and send it to Dad.</p><small>'+String(event.message||'Unknown startup error')+'</small>';}
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
